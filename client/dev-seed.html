<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarmPro 開発テストデータ</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    button { font-size: 18px; font-weight: 700; padding: 14px 22px; cursor: pointer; }
    #message { margin-top: 20px; padding: 14px; background: #f5f5f5; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>FarmPro 開発テストデータ</h1>
  <p>FarmPro本体と同じIndexedDB・同じ登録処理を使います。既存データは削除せず、繁殖雌牛が10頭になるまで不足分だけ追加します。</p>
  <button id="seed">繁殖雌牛を10頭にする</button>
  <div id="message">現在頭数を確認中…</div>

  <script type="module">
    import { createCattle, getCattleList } from '/src/services/api.ts';

    const message = document.getElementById('message');
    const seedButton = document.getElementById('seed');

    async function currentCount() {
      const cattle = await getCattleList();
      return cattle.filter((item) => item.sex === '雌' && item.stage !== '育成牛').length;
    }

    async function showCount() {
      try {
        const count = await currentCount();
        message.textContent = `現在の繁殖雌牛：${count}頭`;
      } catch (error) {
        console.error(error);
        message.textContent = `頭数確認に失敗しました: ${error?.message || error}`;
      }
    }

    seedButton.addEventListener('click', async () => {
      seedButton.disabled = true;
      message.textContent = '追加中…';

      try {
        const cattle = await getCattleList();
        const current = cattle.filter((item) => item.sex === '雌' && item.stage !== '育成牛').length;
        const missing = Math.max(0, 10 - current);

        if (missing === 0) {
          message.textContent = `繁殖雌牛はすでに${current}頭います。追加していません。`;
          return;
        }

        const usedEarTags = new Set(cattle.map((item) => item.earTag));
        let serial = 1;
        let created = 0;

        while (created < missing) {
          const earTag = `TEST-${String(serial).padStart(3, '0')}`;
          serial += 1;
          if (usedEarTags.has(earTag)) continue;

          await createCattle({
            earTag,
            identificationNumber: '',
            name: `テスト繁殖雌牛${current + created + 1}`,
            birthday: '2024-01-01',
            sex: '雌',
            sire: '',
            dam: '',
            parity: 0,
            blvStatus: '未検査',
            stage: '繁殖牛',
            note: '料金プラン頭数制限の開発テスト用',
          });
          usedEarTags.add(earTag);
          created += 1;
        }

        const after = await currentCount();
        message.textContent = `${created}頭追加しました。\n現在の繁殖雌牛：${after}頭\nFarmProホームを再読み込みしてください。`;
      } catch (error) {
        console.error(error);
        message.textContent = `追加に失敗しました: ${error?.message || error}`;
      } finally {
        seedButton.disabled = false;
      }
    });

    showCount();
  </script>
</body>
</html>
