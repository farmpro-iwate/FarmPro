name: Validate Home AI shortcuts

on:
  push:
    branches:
      - ui/home-ai-alert-integrated-20261116
  pull_request:
    branches:
      - ui/home-wagyu-icons-center-mobile-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # The client integration test imports server modules, which need their own dependencies and types.
      - name: Install server test dependencies
        run: npm ci
        working-directory: server
      # Existing integration test imports Node built-ins; provide their types only for CI.
      - run: npm install --no-save --package-lock=false @types/node@20
      - run: npm run build
      - run: npm test
