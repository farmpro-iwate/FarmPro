name: Manual settlement verification
on:
  pull_request:
    paths:
      - 'client/src/services/manualSettlementSave*'
      - 'client/src/utils/manualSettlement*'
      - 'client/src/pages/ManualSettlementReview.tsx'
      - 'client/package*.json'
      - '.github/workflows/manual-settlement.yml'
  workflow_dispatch:
jobs:
  client-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Temporary CI-only lockfile regeneration because the current repository lockfile
      # does not include OCR/PDF dependencies listed in package.json.
      # This does not change the committed lockfile; fix it separately before merge.
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm test -- --run src/utils/manualSettlement.test.ts src/services/manualSettlementSave.test.ts
      - run: npm run build
