name: Validate trial cattle retry

on:
  push:
    branches:
      - fix/trial-deploy-single-cattle-retry-20261017
  pull_request:
    branches:
      - agent/trial-deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npx tsx --test src/routes/cattleRecordSync.createOnly.test.ts
        working-directory: server
      - run: npm run build
        working-directory: server
