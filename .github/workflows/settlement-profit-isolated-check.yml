name: Isolated settlement profit check
on:
  push:
    branches:
      - agent/settlement-profit-isolated-20261027
      - agent/settlement-profit-compatibility-20261027
  workflow_dispatch:
jobs:
  client-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- --run src/services/settlementSellingFees.test.ts src/pages/ExpenseList.settlement.test.tsx
      - run: npm run build
