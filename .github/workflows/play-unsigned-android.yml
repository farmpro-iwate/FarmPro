name: Build unsigned Android TWA prototype (isolated)

on:
  push:
    branches:
      - chore/play-android-from-production-030b012
    paths:
      - '.github/workflows/play-unsigned-android.yml'
      - 'scripts/prepare-play-twa.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-android-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated Android branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Prepare Android SDK layout for Bubblewrap
        run: |
          set -eu
          test -n "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          # Bubblewrap validates an SDK root by checking for root/bin or root/tools.
          # GitHub's Android SDK instead stores sdkmanager under cmdline-tools/latest/bin.
          if [ ! -e "$ANDROID_HOME/bin" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          fi
          test -x "$ANDROID_HOME/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "build-tools;36.1.0" "platforms;android-36"
          test -d "$ANDROID_HOME/build-tools/36.1.0"
          test -d "$ANDROID_HOME/platforms/android-36"
      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli
      - name: Verify publicly hosted Play icons first
        run: node scripts/verify-play-public-icons.mjs
      - name: Generate test-only TWA configuration
        run: node scripts/prepare-play-twa.mjs jp.farmpro.prototype play-test-placeholder.jks farmpro
      - name: Configure Bubblewrap non-interactively
        run: |
          mkdir -p "$HOME/.bubblewrap"
          node -e 'const fs=require("node:fs"); const path=require("node:path"); const jdk=process.env.JAVA_HOME, sdk=process.env.ANDROID_HOME; if(!jdk||!sdk||!fs.existsSync(jdk)||!fs.existsSync(sdk)) process.exit(1); fs.writeFileSync(path.join(process.env.HOME,".bubblewrap","config.json"),JSON.stringify({jdkPath:jdk,androidSdkPath:sdk}));'
      - name: Generate Android project in build directory (not signed)
        working-directory: play-build-local
        run: bubblewrap update --skipVersionUpgrade
      - name: Verify generated project and checksum with precise errors
        working-directory: play-build-local
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const files = ['twa-manifest.json', 'manifest-checksum.txt', 'gradlew'];
          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.error('BUILD_BLOCKED: missing generated file:', file);
              process.exitCode = 1;
            } else {
              console.log('FOUND:', file, fs.statSync(file).size, 'bytes');
            }
          }
          if (process.exitCode) process.exit();
          const expected = crypto.createHash('sha1').update(fs.readFileSync('twa-manifest.json')).digest('hex');
          const saved = fs.readFileSync('manifest-checksum.txt', 'utf8').trim();
          if (saved !== expected) {
            console.error('BUILD_BLOCKED: generated manifest checksum mismatch');
            process.exitCode = 1;
          } else {
            console.log('PASS: generated manifest checksum matches');
          }
          NODE
      - name: Build unsigned APK and AAB
        working-directory: play-build-local
        run: bubblewrap build --skipSigning
      - name: Upload unsigned build files for technical inspection only
        uses: actions/upload-artifact@v4
        with:
          name: farmpro-unsigned-android-prototype
          path: |
            play-build-local/app/build/outputs/apk/release/*.apk
            play-build-local/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
