name: Settlement expense scope check

on:
  push:
    branches:
      - agent/settlement-sandbox-isolated-20261026
  workflow_dispatch:

jobs:
  expense-scope-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client --include=dev
      - run: npm --prefix client test -- --run src/pages/ExpenseList.settlement.test.tsx
