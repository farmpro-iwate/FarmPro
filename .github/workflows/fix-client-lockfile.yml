name: Regenerate client lockfile

on:
  push:
    branches:
      - agent/fix-client-lockfile-ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Regenerate lockfile
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Run client tests
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Commit regenerated lockfile if changed
        run: |
          if git diff --quiet -- client/package-lock.json; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json
          git commit -m "chore: regenerate client package lock"
          git push origin HEAD:agent/fix-client-lockfile-ci
