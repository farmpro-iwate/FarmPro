name: Validate legal bank yearly

on:
  push:
    branches:
      - agent/legal-bank-yearly
  pull_request:
    branches:
      - agent/paid-mainline-sync

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm install --no-audit --no-fund
      - name: Run client tests
        working-directory: client
        run: npm test
      - name: Build client
        working-directory: client
        run: npm run build
