name: LINE isolated validation

on:
  push:
    branches:
      - agent/line-login-foundation-20261014
      - agent/line-withdrawal-intake-723
      - agent/line-withdrawal-guidance-722
      - agent/line-only-settings-status-720
      - agent/line-login-session-guard-717
      - agent/line-login-explicit-switch-719
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --include=dev
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run build
        working-directory: server
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --include=dev
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
