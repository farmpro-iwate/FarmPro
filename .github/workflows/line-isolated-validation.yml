name: LINE isolated validation

on:
  push:
    branches:
      - agent/line-login-foundation-20261014
      - agent/line-billing-error-diagnostics-739
      - agent/line-billing-settings-isolation-738
      - agent/line-billing-session-binding-737
      - agent/line-billing-crash-replay-736
      - agent/line-billing-enrollment-flow-735
      - agent/line-billing-proof-store-734
      - agent/line-billing-reauth-proof-733
      - agent/line-identity-vs-billing-email-732
      - agent/line-billing-email-commit-731
      - agent/line-billing-email-preflight-730
      - agent/line-billing-code-store-729
      - agent/line-billing-email-code-728
      - agent/line-billing-reauth-purpose-727
      - agent/line-billing-email-eligibility-726
      - agent/line-withdrawal-intake-723
      - agent/line-withdrawal-guidance-722
      - agent/line-only-settings-status-720
      - agent/line-login-session-guard-717
      - agent/line-login-explicit-switch-719
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --include=dev
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run build
        working-directory: server
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --include=dev
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
