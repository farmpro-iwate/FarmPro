name: PR Check

on:
  push:
    branches:
      - agent/ai-record-shorthand-flow-guards

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- --run src/ai/registrationIntent.test.ts src/pages/AiHelpPage.test.tsx
      - run: npm run build
