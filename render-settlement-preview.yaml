# Standalone blueprint for settlement testing only.
# Do not replace the existing root render.yaml or apply to farmpro-trial.
# Preview data lives in /tmp and is intentionally NOT durable across restarts.
services:
  - type: web
    name: farmpro-settlement-preview
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm --prefix client ci && npm --prefix client run build && npm --prefix server ci && npm --prefix server run build
    startCommand: npm --prefix server run start:settlement-preview
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FARMPRO_DATA_DIR
        value: /tmp/farmpro-settlement-preview
      - key: FARMPRO_AUTH_SECRET
        generateValue: true
      - key: FARMPRO_SETTLEMENT_TEST_PASSWORD
        sync: false
      - key: FARMPRO_SETTLEMENT_WRITE_PREVIEW
        value: enabled
      - key: FARMPRO_ALLOWED_ORIGIN
        value: https://farmpro-settlement-preview.onrender.com
      - key: FARMPRO_LINE_FULL_APP_PREVIEW
        value: "false"
      - key: FARMPRO_LINE_SIGNUP_PRODUCTION
        value: "false"
